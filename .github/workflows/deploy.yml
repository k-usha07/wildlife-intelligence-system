name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  #  LINT
  # ═══════════════════════════════════════════════════════════════════════
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install ruff black isort

      - name: Lint backend with ruff
        run: ruff check backend/

      - name: Check backend formatting
        run: black --check backend/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npx eslint src/ --ext .js,.jsx || true

  # ═══════════════════════════════════════════════════════════════════════
  #  BACKEND TESTS
  # ═══════════════════════════════════════════════════════════════════════
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: wildlife
          POSTGRES_PASSWORD: wildlife
          POSTGRES_DB: wildlife_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://wildlife:wildlife@localhost:5432/wildlife_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: test-secret-key-for-ci
      ALGORITHM: HS256
      ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx factory-boy

      - name: Apply test schema
        env:
          PGPASSWORD: wildlife
        run: |
          psql -h localhost -U wildlife -d wildlife_test -f database/schema.sql
        continue-on-error: true

      - name: Run backend tests
        working-directory: backend
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ═══════════════════════════════════════════════════════════════════════
  #  FRONTEND TESTS
  # ═══════════════════════════════════════════════════════════════════════
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests (if configured)
        working-directory: frontend
        run: npm test -- --passWithNoTests || true

  # ═══════════════════════════════════════════════════════════════════════
  #  BUILD & PUSH DOCKER IMAGES
  # ═══════════════════════════════════════════════════════════════════════
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for backend
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/wpi-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Extract metadata for frontend
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/wpi-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════
  #  DEPLOY TO RENDER (Backend)
  # ═══════════════════════════════════════════════════════════════════════
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        continue-on-error: true

      - name: Wait for Render health check
        run: |
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf https://wildlife-prediction.onrender.com/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 — waiting 20s..."
            sleep 20
          done
          echo "Backend did not become healthy in time"
          exit 1

  # ═══════════════════════════════════════════════════════════════════════
  #  DEPLOY TO VERCEL (Frontend)
  # ═══════════════════════════════════════════════════════════════════════
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee deploy-url.txt

      - name: Print deployment URL
        working-directory: frontend
        run: echo "Deployed to $(tail -1 deploy-url.txt)"

  # ═══════════════════════════════════════════════════════════════════════
  #  SMOKE TESTS
  # ═══════════════════════════════════════════════════════════════════════
  smoke-test:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Test backend health
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://wildlife-prediction.onrender.com/health)
          echo "Backend /health returned HTTP $STATUS"
          [ "$STATUS" = "200" ]

      - name: Test backend API docs
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://wildlife-prediction.onrender.com/docs)
          echo "Backend /docs returned HTTP $STATUS"
          [ "$STATUS" = "200" ]

      - name: Test frontend
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://wildlife-intelligence-system.vercel.app)
          echo "Frontend returned HTTP $STATUS"
          [ "$STATUS" = "200" ]

      - name: Summary
        run: |
          echo "✅ All smoke tests passed"
          echo "Backend:  https://wildlife-prediction.onrender.com"
          echo "Frontend: https://wildlife-intelligence-system.vercel.app"