version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: wildlife
      POSTGRES_PASSWORD: wildlife
      POSTGRES_DB: wildlife_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildlife -d wildlife_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://wildlife:wildlife@db:5432/wildlife_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      YOLO_MODEL_PATH: /app/models/yolov8_wildlife.pt
      SPECIES_CLASSIFIER_PATH: /app/models/species_classifier.h5
      AUDIO_MODEL_PATH: /app/models/birdnet_model.tflite
      POPULATION_MODEL_PATH: /app/models/population_estimator.pkl
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/storage/media
      - dataset_data:/app/storage/datasets
      - model_data:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  db_data:
  media_data:
  dataset_data:
  model_data: