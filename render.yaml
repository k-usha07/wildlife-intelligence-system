services:
  - type: web
    name: wildlife-prediction
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Wildlife Population Intelligence System
      - key: VERSION
        value: "1.0.0"
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: wildlife-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: '["https://wildlife-intelligence-system.vercel.app"]'
      - key: ENABLE_ML_MODELS
        value: "false"
      - key: MEDIA_STORAGE_PATH
        value: /opt/render/project/src/storage/media
      - key: DATASETS_DIR
        value: /opt/render/project/src/storage/datasets
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: "6379"
    plan: starter

databases:
  - name: wildlife-db
    plan: starter
    postgresMajorVersion: "15"